<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Particle Life — p5.js port</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
  }
  #wrap {
    position: relative;
    line-height: 0; /* kill the inline-canvas gap */
  }
  canvas { display: block; }

  #toggleBtn, #rulesToggleBtn {
    position: absolute;
    top: 10px;
    z-index: 10;
    background: rgba(15, 15, 15, 0.85);
    color: #bbb;
    border: 1px solid #333;
    padding: 6px 10px;
    font-family: monospace;
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
    user-select: none;
  }
  #toggleBtn { left: 10px; }
  #rulesToggleBtn { right: 10px; }
  #toggleBtn:hover, #rulesToggleBtn:hover { background: rgba(35, 35, 35, 0.9); color: #eee; }

  #panel, #rulesSidebar {
    position: absolute;
    top: 46px;
    z-index: 9;
    background: rgba(15, 15, 15, 0.9);
    border: 1px solid #333;
    border-radius: 4px;
    padding: 14px 16px;
    color: #ccc;
    font-family: monospace;
    font-size: 12px;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #panel { left: 10px; width: 190px; }
  #rulesSidebar { right: 10px; width: 260px; font-size: 11px; }

  #panel.hidden, #rulesSidebar.hidden {
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
  }

  #panel .row { margin-bottom: 14px; }
  #panel .row:last-child { margin-bottom: 0; }
  #panel label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    color: #999;
  }
  #panel label .val { color: #ddd; }
  #panel input[type=range] {
    width: 100%;
    accent-color: #7aa8a8;
  }
  #panel button {
    width: 100%;
    margin-top: 4px;
  }

  #rulesSidebar h3 {
    margin: 0 0 8px 0;
    font-size: 12px;
    color: #999;
    font-weight: normal;
    letter-spacing: 0.03em;
  }
  #rulesSidebar textarea {
    width: 100%;
    box-sizing: border-box;
    background: #0a0a0a;
    color: #bbb;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    font-family: monospace;
    font-size: 10px;
    padding: 6px;
    resize: vertical;
  }
  #rulesOutput { height: 130px; margin-bottom: 8px; }
  #rulesInput { height: 90px; margin-top: 4px; margin-bottom: 6px; }
  #rulesSidebar .btnRow { display: flex; gap: 8px; }
  #rulesDivider { border-top: 1px solid #2a2a2a; margin: 12px 0; }
  #rulesStatus {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    color: #7aa8a8;
    min-height: 12px;
    vertical-align: middle;
  }

  button {
    background: rgba(40, 40, 40, 0.9);
    color: #ccc;
    border: 1px solid #333;
    padding: 5px 10px;
    font-family: monospace;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
  }
  button:hover { background: rgba(60, 60, 60, 0.9); color: #eee; }

  #info {
    position: absolute;
    bottom: 8px;
    left: 10px;
    z-index: 8;
    font-size: 11px;
    color: #888;
    background: rgba(15, 15, 15, 0.6);
    padding: 4px 8px;
    border-radius: 3px;
    letter-spacing: 0.02em;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>

<div id="wrap">
  <button id="toggleBtn">≡ controls</button>
  <div id="panel">
    <div class="row">
      <label for="gridSize">grid_size <span class="val" id="gridSizeVal">400</span></label>
      <input type="range" id="gridSize" min="100" max="1200" step="10" value="400">
    </div>
    <div class="row">
      <label for="binSize">bin_size <span class="val" id="binSizeVal">6</span></label>
      <input type="range" id="binSize" min="1" max="24" step="1" value="6">
    </div>
    <div class="row">
      <label for="popSize">pop_size <span class="val" id="popSizeVal">1000</span></label>
      <input type="range" id="popSize" min="200" max="10000" step="1" value="1000">
    </div>
    <div class="row">
      <label for="vLim">v_lim <span class="val" id="vLimVal">1.00</span></label>
      <input type="range" id="vLim" min="0" max="5" step="0.05" value="1">
    </div>
    <button id="genButton">generate</button>
  </div>

  <button id="rulesToggleBtn">{ } rules</button>
  <div id="rulesSidebar" class="hidden">
    <h3>current system</h3>
    <textarea id="rulesOutput" readonly spellcheck="false"></textarea>
    <button id="copyRulesBtn">copy</button>
    <span id="rulesStatus"></span>

    <div id="rulesDivider"></div>

    <h3>load a system</h3>
    <textarea id="rulesInput" placeholder="paste a rules JSON block here" spellcheck="false"></textarea>
    <div class="btnRow">
      <button id="pasteRulesBtn">paste</button>
      <button id="applyRulesBtn">apply</button>
    </div>
  </div>

  <div id="info">R — randomize rules &nbsp;|&nbsp; P — print rules &nbsp;|&nbsp; H — controls &nbsp;|&nbsp; J — rules</div>
</div>

<script>

// ---- tunable state (mutable, driven by the sliders / window size) ----
let GRID_W   = 400;   // simulation space, in grid units
let BIN_W    = 6;     // spatial-hash bin size, in grid units
let SPACE_W  = calcSpaceW(); // canvas size, in pixels — fills the viewport
let SCALE_W  = SPACE_W / GRID_W;

let POP_SIZE = 1000; // directly slider-controlled, not density-derived

let BIN_CAPACITY = 10 * BIN_W * 8;
const NOISE_RATE = 1;
let V_LIM = 1;

const GRID_LINE_MAX = 900; // overlay grid lines stop rendering past this grid_size

const VEL_ADD_RNG = [-1, 1];
const VEL_MUL_RNG = [-1, 1];

// Moore neighborhood offsets, excluding the center cell (matches OFFSETS)
const OFFSETS = [];
for (let dy = -1; dy <= 1; dy++) {
  for (let dx = -1; dx <= 1; dx++) {
    OFFSETS.push([dy, dx]);
  }
}

let TYPES = 5;
let COLORS = [];
let particles = [];
let rules = {};
let grid = {};
let gridReady = false;

let bg;      // static background gridline layer, full resolution
let lowRes;  // low-res particle layer (GRID_W x GRID_W), scaled up on draw

// ---- helpers ----
function calcSpaceW() {
  return Math.floor(Math.min(window.innerWidth, window.innerHeight));
}

function prob(p = 0.5) {
  return Math.random() < p;
}

function randRange([lo, hi]) {
  return lo + Math.random() * (hi - lo);
}

// toroidal wrap into [0, area), matching np.mod's handling of negatives
function wrap1(v, area) {
  return ((v % area) + area) % area;
}

function ruleKey(i, j) {
  return i + ',' + j;
}

function binOf(x, y) {
  return [Math.floor(x / BIN_W), Math.floor(y / BIN_W)];
}

// ---- setup / randomize ----
function buildRandomRules() {
  TYPES = 1 + Math.floor(Math.random() * 9); // np.random.randint(1, 10)

  COLORS = [];
  for (let t = 0; t < TYPES; t++) {
    COLORS.push([
      Math.floor(Math.random() * 255),
      Math.floor(Math.random() * 255),
      Math.floor(Math.random() * 255)
    ]);
  }

  const newRules = {};
  for (let i = 0; i < TYPES; i++) {
    for (let j = 0; j < TYPES; j++) {
      // [placeholder(unused), vel_add_x, vel_add_y, vel_mul_x, vel_mul_y]
      const r = [i, 0, 0, 1, 1];
      if (prob()) r[1] = randRange(VEL_ADD_RNG);
      if (prob()) r[2] = randRange(VEL_ADD_RNG);
      if (prob()) r[3] = randRange(VEL_MUL_RNG);
      if (prob()) r[4] = randRange(VEL_MUL_RNG);
      newRules[ruleKey(i, j)] = r;
    }
  }
  return newRules;
}

function makeParticle() {
  return {
    x: Math.floor(Math.random() * GRID_W),
    y: Math.floor(Math.random() * GRID_W),
    vx: 0,
    vy: 0,
    t: Math.floor(Math.random() * TYPES)
  };
}

function randomize() {
  rules = buildRandomRules();
  particles = [];
  for (let i = 0; i < POP_SIZE; i++) particles.push(makeParticle());
  grid = {};
  gridReady = false;
  refreshRulesOutput();
  console.log('types:', TYPES, '  population size:', POP_SIZE);
}

// ---- spatial hash ----
function getNeighborhood(x, y) {
  const [bx, by] = binOf(x, y);
  const nbrs = [];
  for (const [dy, dx] of OFFSETS) {
    // NOTE: preserved from the original — bin coords are wrapped modulo
    // GRID_W, not the number of bins. At the true edges of the bin grid
    // this misses the wrap-around neighbor bin, same as the python version.
    const nx = wrap1(bx + dx, GRID_W);
    const ny = wrap1(by + dy, GRID_W);
    const key = nx + ',' + ny;
    if (grid[key]) nbrs.push(...grid[key]);
  }
  return nbrs;
}

// ---- simulation step ----
function updateParticles() {
  if (!gridReady) {
    grid = {};
    for (let i = 0; i < particles.length; i++) {
      const [bx, by] = binOf(particles[i].x, particles[i].y);
      const key = bx + ',' + by;
      (grid[key] = grid[key] || []).push(i);
    }
    gridReady = true;
  }

  const newGrid = {};

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const N = getNeighborhood(p.x, p.y);

    let q = (N.length - BIN_CAPACITY * 0.5) / BIN_CAPACITY;
    q = Math.max(0, q);

    for (const j of N) {
      if (i === j) continue;
      const n = particles[j];
      const rule = rules[ruleKey(p.t, n.t)];
      if (!rule) continue;

      let ox = n.x - p.x;
      let oy = n.y - p.y;
      const mag = Math.hypot(ox, oy);
      if (mag === 0) continue; // guards the case pygame's Vector2.normalize() would throw on
      ox /= mag;
      oy /= mag;

      // NOTE: preserved from the original — `off` is normalized before
      // `d` is computed from it, so d = |off| = 1 always.
      const d = 1;

      p.vx += rule[1] * ox * ((d - rule[3]) - (d - rule[4]));
      p.vy += rule[2] * oy * ((d - rule[3]) - (d - rule[4]));
    }

    p.vx = constrain(p.vx, -V_LIM, V_LIM);
    p.vy = constrain(p.vy, -V_LIM, V_LIM);

    p.vx += q * randRange([-NOISE_RATE, NOISE_RATE]);
    p.vy += q * randRange([-NOISE_RATE, NOISE_RATE]);

    p.x += p.vx;
    p.y += p.vy;

    p.x = wrap1(p.x, GRID_W);
    p.y = wrap1(p.y, GRID_W);

    const [bx, by] = binOf(p.x, p.y);
    const key = bx + ',' + by;
    (newGrid[key] = newGrid[key] || []).push(i);
  }

  grid = newGrid;
}

// ---- rebuilds triggered by the sliders / window resize ----
function rebuildBackground() {
  bg.clear();
  bg.background(0);
  if (GRID_W <= GRID_LINE_MAX) {
    bg.stroke(25);
    for (let i = 0; i < SPACE_W; i += BIN_W * SCALE_W) {
      bg.line(0, i, SPACE_W, i);
      bg.line(i, 0, i, SPACE_W);
    }
  }
}

// grid_size changed: space + buffer resize. population is left alone (it's
// independently slider-controlled) — existing particles are just wrapped
// into the new bounds so the pattern carries over instead of re-rolling.
function rebuildSpace() {
  SCALE_W = SPACE_W / GRID_W;

  lowRes.resizeCanvas(GRID_W, GRID_W);
  lowRes.pixelDensity(1);
  lowRes.noSmooth();

  rebuildBackground();

  for (const p of particles) {
    p.x = wrap1(p.x, GRID_W);
    p.y = wrap1(p.y, GRID_W);
  }

  grid = {};
  gridReady = false;
}

// bin_size changed: redraw the overlay grid and invalidate the spatial hash
function rebuildBins() {
  BIN_CAPACITY = 10 * BIN_W * 8;
  rebuildBackground();
  grid = {};
  gridReady = false;
}

// pop_size changed: regenerate the particle array at the new count,
// keeping the current rule set / types
function rebuildPopulation() {
  particles = [];
  for (let i = 0; i < POP_SIZE; i++) particles.push(makeParticle());
  grid = {};
  gridReady = false;
}

// ---- rule import / export ----
function serializeRuleSystem() {
  const ruleMap = {};
  for (const key in rules) {
    const r = rules[key];
    ruleMap[key] = [r[1], r[2], r[3], r[4]];
  }
  return JSON.stringify({ types: TYPES, rules: ruleMap }, null, 2);
}

function refreshRulesOutput() {
  const el = document.getElementById('rulesOutput');
  if (el) el.value = serializeRuleSystem();
}

function applyRuleSystemFromText(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    return { ok: false, error: 'invalid JSON' };
  }
  if (!parsed || typeof parsed.types !== 'number' || !parsed.rules) {
    return { ok: false, error: 'missing "types" or "rules" field' };
  }
  const newTypes = Math.floor(parsed.types);
  if (newTypes < 1) return { ok: false, error: '"types" must be >= 1' };

  const newRules = {};
  for (const key in parsed.rules) {
    const arr = parsed.rules[key];
    if (!Array.isArray(arr) || arr.length !== 4) {
      return { ok: false, error: `rule "${key}" must be a 4-number array` };
    }
    const i = Number(key.split(',')[0]);
    newRules[key] = [i, arr[0], arr[1], arr[2], arr[3]];
  }
  // fill any pairs missing from the paste with identity defaults
  for (let i = 0; i < newTypes; i++) {
    for (let j = 0; j < newTypes; j++) {
      const k = ruleKey(i, j);
      if (!newRules[k]) newRules[k] = [i, 0, 0, 1, 1];
    }
  }

  TYPES = newTypes;
  COLORS = [];
  for (let t = 0; t < TYPES; t++) {
    COLORS.push([
      Math.floor(Math.random() * 255),
      Math.floor(Math.random() * 255),
      Math.floor(Math.random() * 255)
    ]);
  }
  rules = newRules;
  rebuildPopulation();

  return { ok: true };
}

function flashStatus(msg) {
  const el = document.getElementById('rulesStatus');
  if (!el) return;
  el.textContent = msg;
  clearTimeout(flashStatus._t);
  flashStatus._t = setTimeout(() => { el.textContent = ''; }, 2500);
}

// ---- UI wiring ----
function wireControls() {
  const panel = document.getElementById('panel');
  const toggleBtn = document.getElementById('toggleBtn');
  toggleBtn.addEventListener('click', () => panel.classList.toggle('hidden'));

  const gridSlider = document.getElementById('gridSize');
  const gridVal = document.getElementById('gridSizeVal');
  gridSlider.addEventListener('input', () => {
    GRID_W = parseInt(gridSlider.value);
    gridVal.textContent = GRID_W;
    rebuildSpace();
  });

  const binSlider = document.getElementById('binSize');
  const binVal = document.getElementById('binSizeVal');
  binSlider.addEventListener('input', () => {
    BIN_W = parseInt(binSlider.value);
    binVal.textContent = BIN_W;
    rebuildBins();
  });

  const popSlider = document.getElementById('popSize');
  const popVal = document.getElementById('popSizeVal');
  popSlider.addEventListener('input', () => {
    POP_SIZE = parseInt(popSlider.value);
    popVal.textContent = POP_SIZE;
    rebuildPopulation();
  });

  const vlimSlider = document.getElementById('vLim');
  const vlimVal = document.getElementById('vLimVal');
  vlimSlider.addEventListener('input', () => {
    V_LIM = parseFloat(vlimSlider.value);
    vlimVal.textContent = V_LIM.toFixed(2);
  });

  const genBtn = document.getElementById('genButton');
  genBtn.addEventListener('click', () => randomize());
}

function wireRulesSidebar() {
  const sidebar = document.getElementById('rulesSidebar');
  const toggleBtn = document.getElementById('rulesToggleBtn');
  toggleBtn.addEventListener('click', () => sidebar.classList.toggle('hidden'));

  document.getElementById('copyRulesBtn').addEventListener('click', async () => {
    const output = document.getElementById('rulesOutput');
    // select regardless of outcome below, so a manual Ctrl/Cmd+C always works
    output.select();
    output.setSelectionRange(0, output.value.length);

    let copied = false;
    try {
      await navigator.clipboard.writeText(output.value);
      copied = true;
    } catch (e) {
      // Clipboard API is commonly blocked by a sandboxed preview iframe's
      // permissions policy — fall back to the legacy copy command.
      try {
        copied = document.execCommand('copy');
      } catch (e2) {
        copied = false;
      }
    }
    flashStatus(copied ? 'copied' : 'text selected — press ⌘/Ctrl+C');
  });

  const rulesInput = document.getElementById('rulesInput');
  // clear whatever's in the box the moment you click/tab back into it, so a
  // fresh Ctrl/Cmd+V doesn't need a manual select-all first
  rulesInput.addEventListener('focus', () => {
    rulesInput.value = '';
  });

  document.getElementById('pasteRulesBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      rulesInput.value = text;
      flashStatus('pasted');
    } catch (e) {
      // clipboard-read is blocked in most sandboxed preview iframes —
      // click into the box and use Ctrl/Cmd+V instead
      flashStatus('blocked — click box, use ⌘/Ctrl+V');
    }
  });

  document.getElementById('applyRulesBtn').addEventListener('click', () => {
    const text = document.getElementById('rulesInput').value.trim();
    if (!text) { flashStatus('paste a rule set first'); return; }
    const res = applyRuleSystemFromText(text);
    if (res.ok) {
      refreshRulesOutput();
      flashStatus('loaded');
    } else {
      flashStatus('error: ' + res.error);
    }
  });
}

// ---- p5 lifecycle ----
function setup() {
  const cnv = createCanvas(SPACE_W, SPACE_W);
  cnv.parent(document.getElementById('wrap'));
  pixelDensity(1);
  noSmooth();

  bg = createGraphics(SPACE_W, SPACE_W);
  bg.pixelDensity(1);
  rebuildBackground();

  lowRes = createGraphics(GRID_W, GRID_W);
  lowRes.pixelDensity(1);
  lowRes.noSmooth();

  randomize();
  wireControls();
  wireRulesSidebar();
}

function draw() {
  updateParticles();

  background(0);
  image(bg, 0, 0);

  lowRes.clear();
  lowRes.loadPixels();
  for (const p of particles) {
    const x = Math.floor(p.x);
    const y = Math.floor(p.y);
    const idx = 4 * (y * GRID_W + x);
    const c = COLORS[p.t];
    lowRes.pixels[idx]     = c[0];
    lowRes.pixels[idx + 1] = c[1];
    lowRes.pixels[idx + 2] = c[2];
    lowRes.pixels[idx + 3] = 255;
  }
  lowRes.updatePixels();

  image(lowRes, 0, 0, SPACE_W, SPACE_W);
}

function windowResized() {
  SPACE_W = calcSpaceW();
  resizeCanvas(SPACE_W, SPACE_W);
  SCALE_W = SPACE_W / GRID_W;

  bg.resizeCanvas(SPACE_W, SPACE_W);
  bg.pixelDensity(1);
  rebuildBackground();
}

function keyPressed() {
  if (key === 'r' || key === 'R') {
    randomize();
  }
  if (key === 'p' || key === 'P') {
    console.log('rules:', rules);
  }
  if (key === 'h' || key === 'H') {
    document.getElementById('panel').classList.toggle('hidden');
  }
  if (key === 'j' || key === 'J') {
    document.getElementById('rulesSidebar').classList.toggle('hidden');
  }
}

</script>
</body>
</html>
